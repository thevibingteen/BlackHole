buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    buildscript {
        configurations.classpath {
            resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0'
            }
        }
    }
}
subprojects {
    if (project.name != 'flutter_v1_embedding_shim') {
        project.evaluationDependsOn(':app')
    }
    project.plugins.withId("com.android.library") {
        project.android {
            if (namespace == null) {
                namespace project.group
            }
        }
        if (project.name != 'flutter_v1_embedding_shim' && project.name != 'app') {
            project.dependencies {
                compileOnly project(':flutter_v1_embedding_shim')
            }
            project.tasks.withType(JavaCompile).configureEach { task ->
                task.dependsOn(':flutter_v1_embedding_shim:compileReleaseJavaWithJavac')
                task.doFirst {
                    def shimTask = rootProject.findProject(':flutter_v1_embedding_shim')?.tasks?.findByName('compileReleaseJavaWithJavac')
                    if (shimTask != null) {
                        task.classpath = project.files(shimTask.destinationDirectory) + task.classpath
                    }
                    task.source.each { file ->
                        if (file.name == 'AudiotaggerPlugin.java') {
                            def content = file.text
                            if (content.contains('PluginRegistry.Registrar')) {
                                file.text = content.replaceAll(
                                    /public\s+static\s+void\s+registerWith\s*\([^{]+\)\s*\{[\s\S]*?\n\s*\}/,
                                    '// registerWith removed for Flutter v2 embedding'
                                )
                            }
                        }
                    }
                }
            }
        }
    }
    project.plugins.withId("kotlin-android") {
        if (project.name != 'flutter_v1_embedding_shim' && project.name != 'app') {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                task.dependsOn(':flutter_v1_embedding_shim:compileReleaseJavaWithJavac')
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
