name: Build & Release

on:
  push:
    branches:
      - main
      - 'antigravity/*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.47.6"
  PROPERTIES_PATH: "./android/key.properties"

jobs:
  deterministic_tests:
    name: Deterministic Tests & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Statically analyze Dart code
        run: flutter analyze --suggestions

      - name: Run deterministic unit & integration tests
        run: flutter test --exclude-tags=smoke

  live_smoke_tests:
    name: Live Provider Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run live provider smoke tests (bounded timeout)
        run: flutter test --tags=smoke --timeout=30s
        continue-on-error: true

  build_apk:
    name: Build Split-ABI APK
    needs: [deterministic_tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java environment in order to build the Android app.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      # Setup the flutter environment.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Enforce production signing key for public tag releases
      - name: Validate release signing secrets for tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Production signing secrets (KEYSTORE, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS) are missing. Aborting public release to prevent publishing debug-signed APK."
            exit 1
          fi

      # Setup release signing if repository secrets exist
      - name: Setup Keystore if secret exists
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "storePassword=$STORE_PASSWORD" >> "$PROPERTIES_PATH"
            echo "keyPassword=$KEY_PASSWORD" >> "$PROPERTIES_PATH"
            echo "keyAlias=$KEY_ALIAS" >> "$PROPERTIES_PATH"
            echo "storeFile=$GITHUB_WORKSPACE/android/app/keystore.jks" >> "$PROPERTIES_PATH"
            printf '%s' "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/android/app/keystore.jks"
          else
            echo "No production keystore provided. CI will build test/debug-signed APK."
          fi

      # Get flutter dependencies.
      - name: Install dependencies
        run: flutter pub get

      # Build release APKs split by ABI.
      - name: Build release split-ABI APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      # Determine artifact names based on whether this is a release tag or branch build
      - name: Determine artifact names
        id: artifact_names
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "arm64_name=app-arm64-v8a-release" >> "$GITHUB_OUTPUT"
            echo "armeabi_name=app-armeabi-v7a-release" >> "$GITHUB_OUTPUT"
          else
            echo "arm64_name=app-arm64-v8a-test" >> "$GITHUB_OUTPUT"
            echo "armeabi_name=app-armeabi-v7a-test" >> "$GITHUB_OUTPUT"
          fi

      # Upload generated apks as GitHub Actions artifacts for every build.
      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_names.outputs.arm64_name }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_names.outputs.armeabi_name }}
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

  release:
    name: Tag-Driven GitHub Release
    needs: [build_apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Download arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: release-apks

      - name: Download armeabi APK
        uses: actions/download-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: release-apks

      - name: Create GitHub Release on version tag
        uses: softprops/action-gh-release@v2
        with:
          name: BlackHole ${{ github.ref_name }}
          files: |
            release-apks/app-arm64-v8a-release.apk
            release-apks/app-armeabi-v7a-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Send Telegram notification (optional)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            New release for [${{ github.event.repository.name }}](${{ github.event.repository.html_url }}) on ${{ github.ref_name }}.
            Commit: ${{ github.sha }}
          document: release-apks/app-arm64-v8a-release.apk, release-apks/app-armeabi-v7a-release.apk
