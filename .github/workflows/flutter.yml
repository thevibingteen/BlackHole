name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: "stable"
  PROPERTIES_PATH: "./android/key.properties"

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java environment in order to build the Android app.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      # Setup the flutter environment.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Setup optional release signing if repository secrets exist
      - name: Setup Keystore if secret exists
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword=${{ secrets.STORE_PASSWORD }} >> ${{ env.PROPERTIES_PATH }}
            echo keyPassword=${{ secrets.KEY_PASSWORD }} >> ${{ env.PROPERTIES_PATH }}
            echo keyAlias=${{ secrets.KEY_ALIAS }} >> ${{ env.PROPERTIES_PATH }}
            echo storeFile=/home/runner/work/BlackHole/BlackHole/android/app/keystore.jks >> ${{ env.PROPERTIES_PATH }}
            echo ${{ secrets.KEYSTORE }} | base64 --decode > /home/runner/work/BlackHole/BlackHole/android/app/keystore.jks
          fi

      # Get flutter dependencies.
      - name: Install dependencies
        run: flutter pub get

      # Statically analyze the Dart code for any errors.
      - name: Analyze project
        run: flutter analyze .

      # Run unit and API tests.
      - name: Run tests
        run: flutter test

      # Build release APKs split by ABI.
      - name: Build release split-ABI APKs
        run: flutter build apk --release --split-per-abi

      # Upload generated apks as GitHub Actions artifacts for every build.
      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/apk/release/app-armeabi-v7a-release.apk

      # Create public GitHub Release and attach APK assets ONLY when a version tag matching v* is pushed.
      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BlackHole ${{ github.ref_name }}
          files: |
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
            build/app/outputs/apk/release/app-armeabi-v7a-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      # Optional Telegram notification if credentials are configured
      - name: Send Telegram notification (optional)
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            New build for [${{ github.event.repository.name }}](${{ github.event.repository.html_url }}) on ${{ github.ref_name }}.
            Commit: ${{ github.sha }}
          document: build/app/outputs/apk/release/app-arm64-v8a-release.apk, build/app/outputs/apk/release/app-armeabi-v7a-release.apk
