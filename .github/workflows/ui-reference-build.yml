name: UI Reference Build

on:
  push:
    branches:
      - 'ui-reference-build/*'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORIGINAL_MAIN_SHA: "fda23d5236d457a474e40e571010d24666e97f86"
  JAVA_VERSION: "11"
  FLUTTER_VERSION: "3.10.6"

jobs:
  build_ui_reference:
    name: Build Original Main UI Reference APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository at branch root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline and enforce protected UI freeze
        run: |
          echo "Current HEAD commit: $(git rev-parse HEAD)"
          echo "Comparing protected UI paths against pinned baseline $ORIGINAL_MAIN_SHA"
          git fetch origin $ORIGINAL_MAIN_SHA
          echo "Authorized screen diffs (Top Charts, Login Pref, Home Saavn):"
          git diff --stat $ORIGINAL_MAIN_SHA -- "lib/Screens/Top Charts/top.dart" "lib/Screens/Login/pref.dart" "lib/Screens/Home/saavn.dart"
          echo "Enforcing strict 0-diff freeze on all other protected UI paths:"
          git diff --stat $ORIGINAL_MAIN_SHA -- lib/Screens ':!lib/Screens/Top Charts/top.dart' ':!lib/Screens/Login/pref.dart' ':!lib/Screens/Home/saavn.dart' lib/CustomWidgets lib/theme lib/main.dart lib/localization assets
          git diff --exit-code $ORIGINAL_MAIN_SHA -- lib/Screens ':!lib/Screens/Top Charts/top.dart' ':!lib/Screens/Login/pref.dart' ':!lib/Screens/Home/saavn.dart' lib/CustomWidgets lib/theme lib/main.dart lib/localization assets
          echo "UI Freeze validation PASSED: 0 diff in all protected UI directories except authorized screens."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Apply temporary UI Reference identity (runner only)
        run: |
          sed -i 's/applicationId "com.shadow.blackhole"/applicationId "com.shadow.blackhole.ui_reference"/' android/app/build.gradle
          sed -i 's/android:label="BlackHole"/android:label="BlackHole UI Reference"/' android/app/src/main/AndroidManifest.xml
          echo "Verified application ID change:"
          grep -n 'applicationId "com.shadow.blackhole.ui_reference"' android/app/build.gradle
          echo "Verified launcher label change:"
          grep -n 'android:label="BlackHole UI Reference"' android/app/src/main/AndroidManifest.xml

      - name: Generate disposable test keystore and key.properties
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ui_reference.jks \
            -alias uireference \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass temppass123 -keypass temppass123 \
            -dname "CN=UI Reference, OU=BlackHole, O=BlackHole, L=Unknown, ST=Unknown, C=US"

          cat <<EOF > android/key.properties
          storePassword=temppass123
          keyPassword=temppass123
          keyAlias=uireference
          storeFile=$GITHUB_WORKSPACE/android/app/ui_reference.jks
          EOF
          echo "Disposable keystore and key.properties generated."

      - name: Apply temporary CI-only audiotagger dependency replacement (runner only)
        run: |
          python3 -c "import re; p='pubspec.yaml'; s=open(p).read(); s=re.sub(r'  audiotagger:\n    git:\n      url: [^\n]+\n      ref: [^\n]+', '  audiotagger: 2.2.1', s); open(p,'w').write(s)"
          echo "Verified audiotagger replacement in pubspec.yaml:"
          grep -n "audiotagger:" pubspec.yaml

      - name: Resolve dependencies (flutter pub get)
        run: |
          flutter pub get

      - name: Run deterministic backend unit tests
        run: |
          flutter test test/backend_test.dart test/widget_test.dart

      - name: Build Split-ABI Release APKs from root
        run: |
          flutter build apk --release --split-per-abi --dart-define=SPOTIFY_CLIENT_ID="${{ secrets.SPOTIFY_CLIENT_ID || vars.SPOTIFY_CLIENT_ID || '' }}"

      - name: Inspect and verify generated APK files
        run: |
          echo "=== Root Flutter APK outputs ==="
          ls -la build/app/outputs/flutter-apk/ || true
          for apk in build/app/outputs/flutter-apk/*release.apk; do
            if [ -s "$apk" ]; then
              echo "VERIFIED non-empty APK: $apk ($(stat -c%s "$apk") bytes)"
            else
              echo "ERROR: Missing or empty APK: $apk"
              exit 1
            fi
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-main-ui-reference-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-main-ui-reference-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-main-ui-reference-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
